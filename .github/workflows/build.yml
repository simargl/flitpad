name: Makefile CI

on:
  schedule:
    - cron: '0 4 14 * *'
    - cron: '0 4 28 * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfltk1.3-dev libxcursor-dev libxinerama-dev libxft-dev libfuse2 wget

    - name: Compile & Package AppImage
      run: make appimage

    - name: Release and Upload AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0.${{ github.run_number }}"
        
        # Delete any existing older releases and their tags to keep only the latest
        echo "Cleaning up older releases..."
        OLD_TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
        for old_tag in $OLD_TAGS; do
          echo "Deleting release and tag: $old_tag"
          gh release delete "$old_tag" --yes --cleanup-tag || true
        done

        # Create the new release and upload the AppImage
        gh release create "$TAG_NAME" \
          --title "Flitpad $TAG_NAME" \
          --notes "Automated release build for Flitpad." \
          FLitpad-x86_64.AppImage
