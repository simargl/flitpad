name: Makefile CI

on:
  schedule:
    - cron: '0 4 14 * *'
    - cron: '0 4 28 * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Run the entire job inside an Ubuntu Xenial (16.04) container
    container:
      image: ubuntu:16.04

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Prepare Environment & Install Dependencies
      run: |
        # Fix apt repository mirrors for the end-of-life Xenial release
        sed -i -E 's/(archive|security).ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
        
        apt-get update
        apt-get install -y libfltk1.3-dev libxcursor-dev libxinerama-dev libxft-dev libfuse2 wget git curl

    - name: Compile & Package AppImage
      run: make appimage

    - name: Release and Upload AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0.${{ github.run_number }}"
        
        # Install GitHub CLI (gh) since it's not pre-installed in the older container image
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
        apt-get update
        apt-get install -y gh

        # Clean up older releases and their tags
        echo "Cleaning up older releases..."
        OLD_TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
        for old_tag in $OLD_TAGS; do
          echo "Deleting release and tag: $old_tag"
          gh release delete "$old_tag" --yes --cleanup-tag || true
        done

        # Create the new release and upload the AppImage
        gh release create "$TAG_NAME" \
          --title "Flitpad $TAG_NAME" \
          --notes "Automated release build for Flitpad on Ubuntu Xenial." \
          FLitpad-x86_64.AppImage
