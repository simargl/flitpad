name: Makefile CI

on:
  schedule:
    - cron: '0 4 14 * *'
    - cron: '0 4 28 * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Compile & Package AppImage on Ubuntu 16.04
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:16.04 bash -c "
          echo 'deb http://archive.ubuntu.com/ubuntu/ xenial main restricted universe multiverse' > /etc/apt/sources.list
          echo 'deb http://archive.ubuntu.com/ubuntu/ xenial-updates main restricted universe multiverse' >> /etc/apt/sources.list
          apt-get update
          apt-get install -y build-essential libfltk1.3-dev libxcursor-dev libxinerama-dev libxft-dev libfuse2 wget curl git file
          make clean
          make appimage
        "

    - name: Release and Upload AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.0.${{ github.run_number }}"
        
        # Clean up older releases and their tags
        echo "Cleaning up older releases..."
        OLD_TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
        for old_tag in $OLD_TAGS; do
          echo "Deleting release and tag: $old_tag"
          gh release delete "$old_tag" --yes --cleanup-tag || true
        done

        # Create the new release and upload the AppImage
        gh release create "$TAG_NAME" \
          --title "Flitpad $TAG_NAME" \
          --notes "Automated release build for Flitpad (Ubuntu 16.04 compatible)." \
          FLitpad-x86_64.AppImage
